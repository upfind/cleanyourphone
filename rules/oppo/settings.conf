# OPPO / 一加 (OnePlus) / 真我 (Realme) (ColorOS / Realme UI) 系统设置优化项
# 格式: 命名空间(global/secure/system) 键名 目标值 # 注释

# 1. 全局 DoT 去广告 Private DNS (阻断第三方 App 广告 SDK 请求)
global private_dns_mode hostname # 启用加密 DNS
global private_dns_specifier dns.adguard-dns.com # AdGuard 去广告 DNS

# 2. 限制广告跟踪
secure limit_ad_tracking 1 # 限制广告追踪
system personalized_ad_enabled 0 # 关闭个性化推荐
