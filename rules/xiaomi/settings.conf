# 系统全局设置项优化配置 (settings put)
# 格式：命名空间(global/secure/system) 键名 目标值 # 注释说明

# 1. 关闭系统个性化广告推荐与 OAID 广告追踪
secure limit_ad_tracking 1 # 限制广告跟踪（开启限制）
system personalized_ad_enabled 0 # 关闭系统个性化广告推荐

# 2. 注入全局 DoT (DNS-over-TLS) 防广告 Private DNS
# 说明：从底层网络阻断穿山甲、优量汇、百青藤等广告 SDK 的开屏和横幅请求
global private_dns_mode hostname # 启用自定义加密 DNS 模式
global private_dns_specifier dns.adguard-dns.com # 使用 AdGuard 去广告 DNS 节点
